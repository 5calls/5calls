# Content for the temporary /midterms "5 Minute Midterms" page.
# This page is a one-off campaign page; nothing else on the site reads this file.

# Which week is live right now. Weeks before this are "done", weeks after are
# "upcoming". Set this to 0 before the program starts: the page then renders
# the week_zero block below instead of a weekly action, and nothing unlocks.
current_week: 7

nav:
  nudge: Get reminders

# The header and footer donate buttons. The main site's donate form, with this
# page's own refcode so what the midterms program raises can be told apart from
# everything else in ActBlue.
donate:
  label: Donate
  url: https://secure.actblue.com/donate/5calls-donate?refcode=midterms&amount=25

intro:
  title: Five minutes a week. Protect your vote.

# The reader's state. Only one state is configured for now; the header selector
# is FPO until per-state data lands.
#
# name and abbr are rendered: the header selector, the state tag on an action
# card, and the pills on upcoming weeks. Per-state deadline copy comes from
# data/midterms_states.yml, not from here.
state:
  name: California
  abbr: CA

# Pre-launch state, rendered when current_week is 0. The program has been
# announced but no action has gone out yet, so the only thing to do is sign up
# and there is nothing to unlock. Once week 1 ships, set current_week to 1 and
# none of this is used again.
# Prose fields are rendered as markdown, so [links](/vote/verify/) work in them:
# week_zero.lede, week_zero.body, a week's intro and deck_note, and the why
# band's heading and stats. The copy-and-paste `message` is not, since it is
# pasted into a chat as plain text.
week_zero:
  title: A simple plan to ensure your vote is counted
  lede:
    - >-
      With recent unprecedented attempts to block eligible Americans from voting, the most important thing you can do leading up to November 3rd is **take 5 minutes a week to protect your vote**. That means making sure your ballot won't get rejected due to small preventable errors or larger systemic attempts at election sabotage.

    - >-
      Every week, we’ll share a new 5-minute action that will protect you and your ballot. Once you’ve completed your weekly task, you'll **unlock sharable achievement graphics** with **state-specific voting information** that can be shared on social media to inspire and encourage your friends to protect their votes, too.
  body:
    - >-
      We know you might not have time to phone bank or knock doors or even
      unload the dishwasher…But you DO have time to protect your vote.
  signup:
    cta: Sign me up
    placeholder: you@email.com
  why:
    heading: Don’t let fixable hurdles stop your vote from being counted
    stats:
      - value: 21 million
        text: voter registration records were [removed from the rolls](https://www.eac.gov/sites/default/files/2025-07/2024_EAVS_Report_508.pdf#page=33.10) between the 2022 midterms and the 2024 presidential election.
      - value: 93,497
        text: mail ballots were [rejected in the 2026 California primary election](https://calvoter.org/content/making-sense-150000-rejected-california-mail-ballots) for not being received on time.
      - value: 100,000
        text: Election Day [polling locations](https://www.route-fifty.com/management/2024/03/there-are-100000-fewer-election-day-polling-places-2024/394959/) have closed since 2018.

# One entry per week. The entry matching current_week is rendered in full; the
# rest appear in the top strip, which marks the ones the reader has finished.
weeks:
  - number: 1
    short: Checked
    title: Check your voter registration
    state_specific: true
    release: 2026-09-15T09:00:00-07:00
    # Pulls the deadline card from data/midterms_states.yml (VoteAmerica deck)
    # for the reader's state, in place of the copy-and-paste message card.
    state_deck: true
    # Links the CTA at /vote/verify/ instead of the state's own site.
    tool: verify
    deck_cta: Check my registration
    deck_note: >-
      Deadlines and rules come from your state's election office. Checking takes
      about a minute, even if you're sure you're registered.
    # The deadline copy in the deck card, picked by the reader's state's tier in
    # data/midterms_states.yml: A one deadline for every way to register, B
    # same-day registration, C1/C2 deadlines that differ by channel (C2 has no
    # online line), ND no registration. {state}, {date} and {mail_by} are
    # filled in per state from that file. Lines are markdown.
    deck_copy:
      # Tier A: the lede sits over the date, the mail line under it.
      same_day:
        lede: "The deadline to register online, in-person, or by mail is"
        mail_postmarked: "If you choose to register by mail, mail your form by {mail_by} to ensure a valid postmark."
        mail_received: "If you choose to register by mail, mail your form by {mail_by} so it arrives in time."
      # Tiers B, C1 and C2: the lede over one line per way to register.
      various: "{state} has various voter registration deadlines:"
      online: "**Online:** Register by {date}"
      in_person: "**In person:** Register by {date}"
      in_person_same_day: "**In person:** Register by {date} (same-day registration)"
      mail_postmarked: "**By-mail:** Postmark by {date} (mail it by {mail_by}!)"
      mail_received: "**By-mail:** Must arrive by {date} (mail it by {mail_by}!)"
      # North Dakota: the lede, then the line under it.
      no_registration:
        - "North Dakota does not require voter registration, but you must bring a valid form of ID when you go to the polls."
        - "Valid ID includes: ND State ID, ND Drivers License, ND Non-Driver ID, Tribal ID, or Tribal Letter. Learn more at the [ND Secretary of State website](https://www.sos.nd.gov/elections/voter/voting-north-dakota/forms-voter-id)."
    # The same deadlines for the share cards, under the card's own "Voter
    # registration deadlines" heading: the vertical Instagram crop and the
    # horizontal link preview. Same tiers, placeholders and received-by variants
    # as deck_copy, but no links, and a **bold** lead is set bold on the card.
    card_copy:
      # Tier A: the lede, the date on its own line, then the mail line.
      same_day:
        lede: "Register to vote online, in-person, or by-mail by"
        mail_postmarked: "If you choose to register by mail, mail your form by {mail_by} to ensure a valid postmark."
        mail_received: "If you choose to register by mail, mail your form by {mail_by} so it arrives in time."
      # Tiers B, C1 and C2: a bullet per way to register.
      online: "**Online:** Register by {date}"
      in_person: "**In person:** Register by {date}"
      mail_postmarked: "**By-mail:** Postmark by {date} (mail it by {mail_by}!)"
      mail_received: "**By-mail:** Must arrive by {date} (mail it by {mail_by}!)"
      # North Dakota: two lines.
      no_registration:
        - "North Dakota does not require voter registration, but you must bring a valid form of ID when you go to the polls."
        - "ID options include: ND State ID, ND Drivers License, ND Non-Driver ID, Tribal ID, or Tribal Letter."
    # Paragraphs in order; a nested list renders as bullets, and an h3: entry
    # as a subheading.
    intro:
      - h3: "You can’t vote if you’re not registered!"
      - >-
        Over 21 million voter registration records were [removed from voter rolls](https://www.eac.gov/sites/default/files/2025-07/2024_EAVS_Report_508.pdf)
        between the 2022 midterms and the 2024 presidential election. Checking
        your registration status now gives you enough time to register — or re-register — before your state’s deadline. So if you’re not
        sure, check! And if you are sure? Check anyway!
      - >-
        If you enter your information and don’t see a match or are listed as inactive, please [register now](https://5calls.org/vote/register/?from=midterms) to make sure you can vote.
      - "Common reasons people aren’t found in the voter file:"
      - - Your name is spelled differently than on file
        - Your address has changed since you last registered
      - >-
        If any of this sounds like you, go ahead and [re-register with your
        current information](https://5calls.org/vote/register/?from=midterms). It’s a quick way to ensure you can vote in the
        coming election.
    confirm: I confirmed my registration
    # The words the share modal's text platforms prefill, so each can tag 5 Calls
    # by its own handle there; the reader's state share link follows. Facebook's
    # sharer takes a link only, so it has none. Weeks without share_text post
    # the site caption instead.
    share_text:
      threads: "I just confirmed my voter registration with @5calls and 5 Minute Midterms — you should too"
      bsky: "I just confirmed my voter registration with @5calls.org and 5 Minute Midterms — you should too"
      x: "I just confirmed my voter registration with @make5calls and 5 Minute Midterms — you should too"
    # More for the week, in a section below the action: a box that starts
    # closed, labelled with toggle, holding one action laid out like the main
    # one with share images beside it. It can't be opened until the confirm box
    # is ticked, and says so with locked_note beside the toggle. Body paragraphs
    # are markdown; the sample message is copied as plain text.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your registration above to unlock
      part:
        title: Call or text 5 friends
        body:
          - >-
            September 15th is [National Voter Registration Day](https://nationalvoterregistrationday.org/)!
            Reach out to 5 people in your life and remind them to check their
            registration status and protect their vote too.
          - >-
            Anyone you feel comfortable lightly pestering: your roommate, your
            forgetful grownup kid, your cousin who just moved. You might just save
            someone from getting turned away at the polls this election. Low risk,
            high reward!
        message:
          label: Sample message
          text: "Hey, I just made sure I was registered to vote. If you want to join me, it’s really easy to do at 5calls.org/midterms!"
          copy_cta: Copy message
      # Extra credit's share art is the same for every state, so it is used as
      # is rather than drawn per state. The horizontal crop is posted as a link
      # to /midterms/share/1/extra/, whose card is that image; text is the
      # prefilled words per platform, with that link after them, as for the
      # week's own share_text.
      share:
        vertical: images/midterms/share-vertical-week1-extra.jpg
        horizontal: images/midterms/share-horizontal-week1-extra.jpg
        text:
          threads: "I got 5 friends to confirm their voter registration with @5calls and 5 Minute Midterms — you should too"
          bsky: "I got 5 friends to confirm their voter registration with @5calls.org and 5 Minute Midterms — you should too"
          x: "I got 5 friends to confirm their voter registration with @make5calls and 5 Minute Midterms — you should too"
    why:
      heading: Millions have been dropped from the voter rolls without knowing — checking takes less than a minute
      stats:
        - value: Over 19 million
          text: voters were [removed from the rolls](https://www.brennancenter.org/topics/voting-elections/vote-suppression/voter-purges) between 2020 and 2022.
        - value: Fewer than 30%
          text: of 18 year olds [are registered to vote](https://www.theguardian.com/commentisfree/2026/jun/21/young-people-voter-registration).
        - value: Two-thirds
          text: of states had [lower active voter registration rates](https://www.eac.gov/sites/default/files/2025-07/2024_EAVS_Report_508.pdf) in 2024 than in 2020.

  - number: 2
    short: Options
    title: Know your voting options
    state_specific: true
    release: 2026-09-22T09:00:00-07:00
    # This week sends nobody to a voting tool: the action is reading your own
    # state's voting options, drawn from data/midterms_voting.yml rather than
    # the registration deck week one used.
    state_voting: true
    deck_cta: Review my voting options
    # The button under the voting options, and the line under it. The file is
    # per state and the switcher rewrites the link, so the button always hands
    # over the reader's own deadlines.
    calendar_cta: Add deadlines to my calendar
    # The link in here is the fallback for anything that cannot open a
    # webcal:// address. Its state code is rewritten by the switcher like every
    # other /midterms/calendar/ link, so it hands over the reader's own dates.
    calendar_note: >-
      On a phone this opens the list of dates for you to add. On a computer it
      opens Apple Calendar or Outlook to add them for you. If nothing happens,
      [download the file instead](/midterms/calendar/ca.ics) and open it.
    deck_note: >-
      Remember, things like polling locations can change at any time, so always
      check with your local election commission for the most up-to-date
      information.
    # The share panel's locked note names this week's action rather than week
    # one's registration check. Omit this block and a week falls back to the
    # global images.locked_note near the foot of this file.
    images:
      locked_note: Confirm your voting options on the left to unlock the share images.
      locked_note_stacked: Confirm your voting options above to unlock the share images.
    intro:
      - >-
        Have you thought about whether you’ll vote in-person or by mail this
        election? Can you vote early or will you head to the polls on Election
        Day?
      - >-
        You don’t have to decide now. But **it’s important that you know all your
        options** and **[add deadlines to your
        calendar](/midterms/calendar/ca.ics)** so that you’re prepared to make
        an informed decision.
      - "**Things to know:**"
      - - Does your state offer early in-person voting? If so, when is it?
        - Are you eligible to vote by mail?
        - What’s the deadline to request an absentee ballot?
        - What are your options for returning your ballot?
      - >-
        All of this varies from state to state, but we’re here to help you get
        the answers so that nothing **prevents you from voting** this election season.
    confirm: I know my state’s voting options
    # More for the week, in a section below the action. Week two's has no share
    # art of its own, and no share key below, so the panel beside it is not
    # drawn at all and no /midterms/share/2/extra/ page is built. Adding a
    # share block here is what turns both back on.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your voting options above to unlock
      part:
        title: Help a student get ready to vote
        # A {cta: …} entry renders as a button where it sits, so the tool comes
        # after the paragraph that introduces it and before the one about
        # texting someone else.
        body:
          - >-
            [Less than a third of students](https://tufts.app.box.com/v/democracy-counts-2022)
            and only about [23% of eligible youth voters](https://circle.tufts.edu/2022-election-center)
            turned out to vote in the 2022 midterms.
          - >-
            Are you in college? Check out this tool designed specifically to help
            students navigate the challenges of registration and voting while in
            school.
          - cta:
              label: Check out the college voter tool
              url: /vote/college/
          - >-
            Do you know a college student? Send them a quick text to help them get
            election-ready. It only takes a minute!
        message:
          label: Sample message to student
          # Our own page around VoteAmerica's college tool, and deliberately
          # without ?from=midterms: that marker offers a way back to 5 Minute
          # Midterms, and the person reading this is the student being texted,
          # not the reader running the week.
          text: "Hi [NAME], I just wanted to see if you’re ready to vote this November! If you’re not sure what your options are, here’s a helpful tool designed just for college students: https://5calls.org/vote/college/"
          copy_cta: Copy message
    why:
      heading: Election Day is not the only day to vote, it’s the last day to vote.
      stats:
        - value: 8 states and D.C.
          text: conduct elections [entirely by mail](https://www.ncsl.org/elections-and-campaigns/table-1-states-with-no-excuse-absentee-voting) with mail ballots automatically sent.
        - value: 26 states
          text: require early voting on [at least some weekend days](https://ballotpedia.org/Early_voting_dates,_2026).
        - value: 16 states
          text: allow citizens to [register and vote simultaneously](https://electionlab.mit.edu/research/voter-registration) during the early voting period and on Election Day.

  - number: 3
    short: ID check
    title: Check your ID requirements
    state_specific: true
    release: 2026-09-29T09:00:00-07:00
    # Like week two, this week sends nobody to a copy-and-paste message: the
    # action is reading your own state's ID rules, drawn from
    # data/midterms_id.yml. The button goes to that state's own election
    # office, which is a different page in every state, so its href comes
    # from the data rather than from here.
    state_id: true
    deck_cta: Learn more about my state's ID requirements
    deck_note: >-
      If you have any questions, you should contact your local election
      commission for the most up-to-date information.
    # The share panel's locked note names this week's action.
    images:
      locked_note: Confirm your ID requirements on the left to unlock the share images.
      locked_note_stacked: Confirm your ID requirements above to unlock the share images.
    intro:
      - >-
        There's no single set of rules here. Every state has different
        requirements and some are more strict than others. **Most states require
        some form of identification to vote, and others only require it for
        first-time voters.** Voter ID laws are also subject to change, so even if
        you think you know your state's rules, it's important to check!
      - "**Things to know:**"
      - - Does your state require a government-issued photo ID, photo ID, or non-photo ID? Or is ID only required for first-time voters?
        - Does your ID need to be current or will they accept an expired ID?
    # The share card's second line, under the bold requirement. The same in
    # every state: the card names what is needed, the page lists what counts.
    card_note: Learn more about accepted ID types at 5calls.org/midterms
    # A last line under the "things to know" list. The link goes to the
    # reader's own state's ID page -- the same one the card's button uses, and
    # the state switcher moves both together -- so only the words are here.
    intro_link:
      text: >-
        If you don’t have an acceptable ID, learn more about your backup
        options
      label: from your Secretary of State
    confirm: I have the ID I need to vote
    # More for the week, in a section below the action. Like week two's, this
    # one has no share art of its own and no share key, so the panel beside it
    # is not drawn and no /midterms/share/3/extra/ page is built. Adding a
    # share block here is what turns both back on.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your ID requirements above to unlock
      part:
        title: Help a voter get the necessary ID
        # Two asks, in order: get yourself an ID through VoteRiders, then pass
        # the same offer on. The {cta: …} button sits between them, so the
        # paragraph after it is what the sample message answers.
        body:
          - >-
            Voter ID laws might not sound like an obstacle to voting, but many
            Americans lack the identification required by their state. For
            example, [18% of U.S. citizens over the age of 65, 16% of Latino
            voters, 25% of Black voters, and 15% of low-income Americans](https://indivisible.org/resource/voter-id-101-right-vote-shouldnt-come-barriers/)
            do not have an acceptable photo ID.
          - >-
            Do you need to get an ID before voting in this election?
            [VoteRiders](https://voteriders.org/freehelp/) provides free
            one-on-one help to individuals who need to secure an accepted form
            of ID to vote.
          - cta:
              label: Request help from VoteRiders
              url: https://voteriders.org/freehelp/
          - Do you know someone who needs help getting an ID? Send them a quick text to help them get election-ready. It only takes a minute!
        message:
          label: Sample message
          # Pasted into a chat as plain text, so no markdown and a bare URL.
          text: "Hi [NAME], I just wanted to see if you need any help getting an ID! VoteRiders offers free one-on-one assistance to individuals who need to secure an accepted ID to vote. Here’s the link: https://voteriders.org/freehelp"
          copy_cta: Copy message
    why:
      heading: Most states require some form of ID to vote.
      stats:
        - value: 36 states
          text: have laws [requesting or requiring voters](https://www.ncsl.org/elections-and-campaigns/voter-id) to show some form of ID at the polls.
        - value: At least 9 states
          text: have [enacted new stricter voter ID requirements](https://www.brennancenter.org/our-work/research-reports/state-state-guide-restrictive-changes-voter-id-mail-voting-and-ballot) since 2020.
        - value: At least 6 states
          text: have [voter ID measures on the ballot](https://voteriders.org/article/voters-across-the-country-will-decide-whether-to-enact-new-and-stricter-voter-id-laws-this-year/) in the 2026 election, the highest number ever.

  - number: 4
    short: Ballot
    title: Know your ballot
    state_specific: true
    release: 2026-10-06T09:00:00-07:00
    # One finished share image per crop for every state, used as is.
    card:
      vertical: images/midterms/share-vertical-week4.png
      horizontal: images/midterms/share-horizontal-week4.png
    intro:
      - >-
        Election Day is right around the corner, and if you're voting early or
        by mail, it’s even sooner! It's time to **decide who and what you're
        voting for**. We’re not procrastinating this time! By the way, if your
        state offers early voting we strongly suggest you vote early if
        possible.
      - >-
        You probably know how you're voting at the top of the ticket, but we
        want to help you **get familiar with the issues and candidates all the way
        down the ballot** because state and local races have a huge impact on your
        day-to-day life.
      - >-
        [BallotReady](https://www.ballotready.org/) allows you to **explore what’s on your ballot**, research
        candidates, and make informed decisions so that you know exactly what to
        do when it comes time to vote. Once you have your sample ballot
        prepared, voting becomes an open book test. Easy breezy!
      - >-
        All you need to do is enter your address (the one used to register to
        vote) and you’ll get a personalized ballot for your district that you
        can fill out and save to reference later.
    headline: REVIEW YOUR BALLOT
    message: >-
      Go to BallotReady to review what’s on your ballot.
    # BallotReady is still loading some states' ballots. A state listed here
    # gets a line under the message, swapped with the state picker: `dated`
    # for a state with a date, `soon` for one marked soon. A dated line stops
    # showing once its day has passed. Dates are written the way the voting
    # data writes them.
    state_note:
      dated: "BallotReady expects {state}’s ballot information to be ready on {date}."
      soon: "BallotReady expects {state}’s ballot information to be ready shortly."
      states:
        AL: Tue, Oct 6
        AK: Thu, Oct 8
        AR: Fri, Oct 9
        CT: Fri, Oct 9
        DE: Fri, Oct 9
        IN: Wed, Oct 7
        MI: Wed, Oct 7
        MN: Tue, Oct 6
        MS: Fri, Oct 9
        NE: Mon, Oct 12
        NH: Fri, Oct 9
        OK: Fri, Oct 9
        RI: Mon, Oct 12
        VT: Tue, Oct 6
        IA: soon
        MA: soon
        NY: soon
        TN: soon
        TX: soon
    # One button out to BallotReady in place of copy and rewrite.
    link_cta:
      label: See what’s on my ballot
      url: https://www.ballotready.org/
    confirm: I know my ballot - unlock my graphics!
    # More for the week, in a section below the action. Like weeks two and
    # three, no share art of its own and no share key, so no share panel and
    # no /midterms/share/4/extra/ page.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your ballot prep above to unlock
      part:
        title: Help friends with their ballot prep
        body:
          - >-
            Plenty of voters fill in the top of the ticket and leave the rest
            blank. In the 2022 midterms, [roughly 1 in 10 voters](https://stateswin.org/research/down-ballot-roll-off-patterns-in-2022/)
            in battleground-state districts voted for governor or Senate but
            skipped their state legislative race entirely. Those down-ballot
            races decide who runs your schools, courts, and statehouse, and a
            sample ballot makes it easy to vote all the way down.
          - Do you know someone who could use a little help with their research?
        message:
          label: Sample message
          # Pasted into a chat as plain text, so no markdown and a bare URL.
          text: "Hi [NAME]! I just reviewed everything on my ballot using 5 Minute Midterms including the local races I knew very little about. If you need help prepping your ballot before you vote you should check it out too! Here's the link: https://5calls.org/midterms"
          copy_cta: Copy message
    why:
      heading: Voting is important. Informing your vote is critical.
      stats:
        - value: Over 6,100
          text: state legislative seats across 46 states [are up for election in 2026](https://organizations.ballotready.org/research/2026-state-legislatures), enough to swing partisan majorities in almost every chamber next year.
        - value: Lower turnout
          text: is frequently a result of a [lack of awareness of the candidates and issues](https://www.lwv.org/blog/local-candidates-must-fill-out-voter-guides-have-yours).
        - value: Nearly 50%
          text: of the members of Congress previously [served in state legislatures](https://www.ncsl.org/state-legislatures-news/details/flow-of-state-lawmakers-to-congress-remains-strong).

  - number: 5
    short: Plan
    title: Make your voting plan
    state_specific: true
    release: 2026-10-13T09:00:00-07:00
    intro:
      - >-
        Election Day is only a few weeks out and Early Voting is already
        underway in some states! It's time to talk specifics. People who make a
        concrete plan to vote are [more likely to actually follow through on
        their intention](https://marketing.wharton.upenn.edu/wp-content/uploads/2016/10/nickerson20and20rogers_FINAL.pdf),
        so let's nail down the **HOW**, the **WHEN**, and the **WHERE**.
      - >-
        Speaking of WHEN, **we strongly encourage you to vote early** if you have
        the option. If there's an issue with your registration, your ID, or
        your mail ballot, it’s best that you find out before November 3rd.
        Voting early also protects your vote from the unexpected. You never
        know what might happen on Election Day, and you don’t want a sick kid,
        a broken-down car, or bad weather to keep you from voting.
    # The action is a list of questions, drawn by midterms-plan.html instead
    # of a message card. Nothing is sent anywhere: the answers stay in this
    # browser. Once the reader says they're done, the questions fold into
    # their answers, laid out to screenshot, and can be saved as an image.
    #
    # Each step is a `question` and its `fields`, answered in order:
    #   date    a day from a small calendar. `rule` says which days it offers,
    #           from the reader's state: early, fill or return (see
    #           midterms-plan-rules.html)
    #   time    a time and am/pm
    #   text    free text, with a placeholder
    #   choice  one of `options`, each {key, label}. With a `rule`, the
    #           reader's state decides which keys are offered; where it offers
    #           only one, that one is picked and the question is skipped
    # A field's `name` is what a later step's `show` looks at: the step only
    # appears while that field holds that key. `hint` puts the state's line
    # under the question, `note` puts a fixed one there, `warn` shows its text
    # while the step's choice holds that key, and `state_warn` names a warning
    # from the reader's state, shown whenever the state has one. `summary`
    # labels the answer in the finished plan; a step without one is left out.
    images:
      locked_note: Finish your plan and confirm it on the left to unlock the share images.
      locked_note_stacked: Finish your plan and confirm it above to unlock the share images.
    plan:
      headline: MAKE YOUR VOTING PLAN
      summary_headline: MY VOTING PLAN
      question: How are you voting?
      # The first row of the finished plan; each step's own row is its
      # `summary`, with `summary_prefix` before the answers where they need it.
      summary_way: How I’m voting
      ways:
        - key: person
          label: In person
        - key: mail
          label: By mail
      prompt: Pick one to start your plan.
      done_cta: I made my plan
      edit_cta: Edit my plan
      # Saves the finished plan as an image drawn like the summary on the page.
      download_cta: Download my plan
      download_file: my-voting-plan.png
      download_url: 5calls.org/midterms
      # Under a question or date, from the state's own voting data: see
      # midterms-plan-rules.html. {state}, {from}, {to} and {date} are filled in.
      notes:
        early_dates: "Early voting in {state} runs {from} to {to}."
        county: Your county sets early voting dates and hours, so check yours before you pick a day.
        no_early: "{state} has no in-person early voting, so Election Day is the day."
        mail_by: "We recommend returning your ballot by {date}, a week before the deadline."
        # Under the return date when it's handed in rather than mailed. There's
        # no transit time, so these give the deadline and nothing else.
        # {deadline} is the day, with a time where the state sets one.
        drop_box: "Drop boxes in {state} take ballots until {deadline}."
        in_person: "{state} takes ballots handed in until {deadline}."
        in_person_id: "Bring a photo ID: {state} asks for one when you hand in a ballot."
        # After every line about ID (the ID question's, a hand-in note that
        # asks for one, an envelope warning that mentions one), linking to the
        # state's ID page from week three.
        id_link: Learn more about your state’s ID requirements
        # In place of the prompt in a state that only votes by mail.
        mail_only: "{state} votes by mail, so your plan is about getting your ballot back."
        # Under a mailed return date once one is picked: in the last week before
        # the deadline, or earlier. {date} is the week-early date for the state,
        # and {deadline} the state's rule, one of the two lines below with its
        # {date} filled in (and the time, where the state sets one).
        return_late: "Your ballot must {deadline}. Due to changes in USPS postmarking rules, we highly recommend returning your ballot by {date} to meet your deadline."
        deadline_received: "arrive by {date}"
        deadline_postmarked: "be postmarked by {date}"
        return_early: Good job! That's before the deadline, with time to spare.
        # Under the return date when it comes before the fill-out date. Both
        # pickers offer every valid day; this only flags the mix-up. {date} is
        # the fill-out date.
        return_before_fill: "That's before {date}, the date you plan to fill out your ballot."
      calendar:
        # Under the calendar, the days that can be picked: {from} and {to} are
        # the first and last open day, {from} reading "today" when it is.
        available: "In {state}, you can pick any day from {from} through {to}."
        available_one: "In {state}, {date} is the only day you can pick."
        today: today
        late: Shaded days are the last week before the deadline. We recommend returning your ballot a week early.
        late_label: last week before the deadline
        election_day: Election Day
        previous: Previous month
        next: Next month
      steps:
        person:
          - question: Will you vote early or on Election Day?
            hint: vote_when
            fields:
              - name: when
                type: choice
                rule: vote_when
                options:
                  - { key: early, label: Early }
                  - { key: election, label: On Election Day }
          - question: What day and time will you go?
            show: { when: early }
            summary: When I’m voting
            fields:
              - { name: early_day, type: date, rule: early, placeholder: pick a day }
              - { name: early_time, type: time, placeholder: "10:00" }
          - question: Do you know where you’re going to vote?
            show: { when: early }
            summary: I know where I’m voting
            # Shown while the plan is being made, not in the saved summary.
            warn:
              value: "no"
              text: Look up your polling place before you go.
              link: { label: Find where to vote, url: "https://www.voteamerica.org/where-to-vote/" }
              form_only: true
            fields:
              - name: early_site
                type: choice
                options:
                  - { key: "yes", label: "Yes" }
                  - { key: "no", label: "No" }
          - question: What time will you go on Nov 3rd?
            show: { when: election }
            hint: election
            summary: When I’m voting
            summary_prefix: Election Day, Nov 3
            fields:
              - { name: election_time, type: time, placeholder: "10:00" }
          - question: Do you know where you’re going to vote?
            show: { when: election }
            summary: I know where I’m voting
            # Shown while the plan is being made, not in the saved summary.
            warn:
              value: "no"
              text: Look up your polling place before you go.
              link: { label: Find where to vote, url: "https://www.voteamerica.org/where-to-vote/" }
              form_only: true
            fields:
              - name: polling_place
                type: choice
                options:
                  - { key: "yes", label: "Yes" }
                  - { key: "no", label: "No" }
          - question: How will you get there?
            summary: How I’m getting there
            fields:
              - name: how
                type: choice
                options:
                  - { key: walk, label: Walk }
                  - { key: drive, label: Drive }
                  - { key: bike, label: Bike }
                  - { key: bus, label: Bus }
                  - { key: other, label: My own way }
          - question: Who is going with you?
            summary: Who I’m going with
            fields:
              - { name: who, type: text, placeholder: "a friend, my family, just me" }
          # Asked only in states that ask voters for ID; the line under it is
          # the state's week-three summary. Elsewhere the state allows only
          # "none", so the form picks it and skips the question.
          - question: Do you have ID?
            hint: id
            summary: I have my ID
            fields:
              - name: id
                type: choice
                rule: id
                options:
                  - { key: "yes", label: "Yes" }
                  - { key: "no", label: "No" }
                  - { key: none, label: "Not needed" }
        mail:
          - question: When will you fill out your ballot?
            summary: Filling out my ballot by
            fields:
              - { name: fill_day, type: date, rule: fill, placeholder: pick a day }
          - question: How will you return your ballot?
            note: Return your ballot at least a week before the deadline, so it has time to arrive and be counted.
            summary: Returning it by
            fields:
              - name: return_how
                type: choice
                rule: return_how
                options:
                  - { key: mail, label: Mail }
                  - { key: dropbox, label: Drop box }
                  - { key: office, label: County election office }
          # The return date offers any day a way back allows until one is
          # picked above, then narrows to that way's days.
          - question: When will you return your ballot?
            summary: Returning it
            fields:
              - { name: return_day, type: date, rule: return, placeholder: pick a day }
              - { name: return_time, type: time, placeholder: "10:00" }
          - question: Will you sign and date your ballot and/or envelope?
            summary: Signed and dated
            warn:
              value: "no"
              text: An unsigned ballot can be rejected. Sign and date it before you return it.
            state_warn: envelope
            fields:
              - name: signed
                type: choice
                options:
                  - { key: "yes", label: "Yes" }
                  - { key: "no", label: "No" }
    # The share art follows the reader's plan rather than their state: one
    # card per combination of the answers below, drawn by
    # midterms-card-week5.html onto the designed plates, with its own share
    # page at /midterms/share/5/<key>/. Each card is one sentence, built from
    # the parts below in order; {braces} mark the reader's answers, set in
    # bold on a highlighter stroke. A part that starts with punctuation joins the one
    # before it without a space.
    plan_card:
      # Until the reader finishes their plan.
      default: "I know {how}, {when} and {where} I’m voting."
      person:
        when:
          early: "I will vote {in person early}. I will get to {my early voting site}"
          election: "I will vote {in person on Election Day}. I will get to {my polling location}"
        how:
          walk: "{on foot},"
          drive: "by {car},"
          bike: "by {bike},"
          bus: "by {bus},"
          other: "{my own way},"
        id:
          "yes": "and {I’ll have my ID}."
          "no": "and {I’ll get my ID in time}."
          none: "and {I don’t need an ID}."
      mail:
        way: "I will vote {by mail}."
        return_how:
          mail: "I will return my ballot {by USPS}"
          dropbox: "I will return my ballot {at a drop box}"
          office: "I will return my ballot {to the election office}"
        signed:
          "yes": ", and {I’ll sign and date my envelope}."
          "no": "."
    confirm: I made my voting plan - unlock my achievement graphics!
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your voting plan above to unlock
      # Two asks, each with its own heading: send a friend the link, then hand
      # out the printable worksheet. `parts` takes a list of what `part` takes.
      parts:
        - title: Encourage friends to make a voting plan
          body:
            - Now that you’ve made your voting plan, it’s time to share the love (of democracy).
          message:
            label: Sample message
            # Pasted into a chat as plain text, so no markdown.
            text: "Hi [NAME]! I just made my plan to vote using 5 Minute Midterms. You should make your plan too! Here’s the link: 5calls.org/midterms"
            copy_cta: Copy message
        - title: Encourage your community to make a voting plan
          body:
            - >-
              If you have access to a printer, print out 5–10 pages of our Make
              Your Voting Plan handout, cut on the dotted lines (there are 4
              blank plans per page), and set them out at your local coffee
              shop, bring them to a No Kings rally, or put a stack in the break
              room at work. The more people who make a voting plan, the better!
            - cta:
                label: Download voting plan handout
                url: /midterms/voting-plan.pdf
                download: 5calls-voting-plan.pdf
          # One worksheet off the PDF's first page, rendered with
          #   pdftoppm -r 200 -x 0 -y 0 -W 848 -H 1098 -png -singlefile \
          #     static/midterms/voting-plan.pdf assets/images/midterms/voting-plan-preview
          preview:
            image: images/midterms/voting-plan-preview.png
            alt: One of the four blank voting plans on the handout page
            url: /midterms/voting-plan.pdf
            download: 5calls-voting-plan.pdf
    why:
      heading: A voting plan helps you follow through on your intention to vote.
      stats:
        - value: Turnout increases
          text: by [over 4%](https://pubmed.ncbi.nlm.nih.gov/20424044/) when voters are encouraged to form a logistical voting plan.
        - value: About 40%
          text: of the eligible voting population [has voted in midterm elections in recent decades](https://fairvote.org/resources/voter-turnout/?section=turnout-in-the-united-states), with 2018 marking the highest midterm turnout in over a century.
        - value: Young people
          text: between the ages of 18 and 29 typically [turn out at a rate 10+ points lower](https://fairvote.org/resources/voter-turnout/?section=what-affects-voter-turnout) than those who are 30 and older.

  - number: 6
    short: Location
    title: Find your voting location (and vote!)
    state_specific: true
    release: 2026-10-20T09:00:00-07:00
    intro:
      - >-
        Last week you made your plan to vote, so you should know **HOW** and **WHEN**
        you’re voting. The last piece is knowing exactly **WHERE** to go. Whether
        you’re voting by mail, early in-person, or on Election Day, you can’t
        assume it's the same place as last time. Polling places and dropboxes
        can change from one election to the next, and Early Voting sites are
        often different from Election Day locations. Take a few minutes now to
        make sure you know where you’re headed. And vote early if you can!!
      - >-
        Do you have your mail ballot? It’s time to start filling it out if you
        haven’t already! As Election Day approaches, returning your ballot to an
        official dropbox or directly to the election office is the best
        guarantee that it arrives in time. Check your state's deadlines, find
        your dropbox or election office, and turn it in. If you're mailing your
        ballot, **we highly recommend returning it by Tuesday, October 27th at the
        latest**. [Due to recent changes, the USPS may not postmark your ballot
        the day it’s received,](https://www.npr.org/2026/10/09/nx-s1-5984981/mail-in-ballot-usps-postmark)
        so you don’t want to cut it close!
    headline: FIND WHERE TO VOTE
    # FPO: the copy doc has no message line for this week yet.
    message: >-
      Find your polling place, early voting site, or
      ballot dropbox:
    # The reader's state's ways to vote, under the message: early voting where
    # the state has it, or Election Day where it doesn't, then OR and how to
    # return a mail ballot. Drawn by layouts/partials/midterms-where.html from
    # data/midterms_voting.yml. **Bold** sets a line's label.
    where:
      early: "**In-person early voting:** {start} to {end}"
      early_varies: "**In-person early voting:** Dates are set by your county"
      early_varies_end: "**In-person early voting:** Dates are set by your county, through {end}"
      election_day: "**In-person voting** on Election Day, Tue, Nov 3"
      or: OR
      return: "**How to return your mail-in ballot:** {methods}"
      return_mail_received: "**By mail:** Received by {date}"
      return_mail_postmarked: "**By mail:** Postmarked by {date}"
      return_mail_arrive: ", and must arrive by {date}"
      return_mail_by: " (mail it by {date}!)"
      return_in_person: "**In person:** Received by {date}"
    # The share modal's prefilled words for the week's own cards ("I know where
    # I'm voting"), as for week one. FPO: placeholder wording.
    share_text:
      threads: "I know where I'm voting — find your voting location with @5calls and 5 Minute Midterms"
      bsky: "I know where I'm voting — find your voting location with @5calls.org and 5 Minute Midterms"
      x: "I know where I'm voting — find your voting location with @make5calls and 5 Minute Midterms"
    # A second set of share cards beside the week's own, "I voted early!", on
    # their own plates with the same state rules. Each state's link goes to
    # /midterms/share/6/early-ca/, whose card is that set's. `label` heads each
    # set in the share panel; `text` is that set's prefilled words.
    # FPO: placeholder wording.
    early_cards:
      week_label: I know where I'm voting
      label: I voted early!
      text:
        threads: "I voted early! Find your voting location with @5calls and 5 Minute Midterms"
        bsky: "I voted early! Find your voting location with @5calls.org and 5 Minute Midterms"
        x: "I voted early! Find your voting location with @make5calls and 5 Minute Midterms"
    # One button out to VoteAmerica's lookup in place of copy and rewrite.
    link_cta:
      label: Find where to vote
      url: https://www.voteamerica.org/where-to-vote/
    confirm: I found my voting location - unlock my achievement graphics!
    # FPO: placeholder extra credit until the real copy lands. Like week four,
    # no share art or share key, so no share panel and no extra share page.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm your voting location above to unlock
      # The heading over the handbook card, in place of "Extra credit shares".
      share_title: Tell your friends!
      part:
        title: Share the 5 Calls Voter Handbook
        body:
          - >-
            Deadlines, voting options, and ID rules vary by state, and a lot of
            people don't know theirs. Share the 5 Calls Voter Handbook for your state on your social
            channels to remind your friends exactly how and where they can vote.
        message:
          label: Sample post
          # Pasted into a post as plain text, so no markdown and a bare URL.
          # {state} becomes the reader's state, and follows the switcher.
          text: "Election Day is Tuesday, Nov 3. Here's everything you need to know to vote in {state}: deadlines, early voting, mail ballots, and ID rules. Make your plan at 5calls.org/midterms"
          copy_cta: Copy message
      # The words the share modal's text platforms prefill when sharing the
      # handbook, as for a week's share_text; that state's handbook page,
      # /midterms/share/6/handbook-ca/, follows them.
      # FPO: placeholder wording.
      share_text:
        threads: "I just reviewed my state's voter handbook with @5calls and 5 Minute Midterms — check yours"
        bsky: "I just reviewed my state's voter handbook with @5calls.org and 5 Minute Midterms — check yours"
        x: "I just reviewed my state's voter handbook with @make5calls and 5 Minute Midterms — check yours"
      # The voter handbook: one card per state, drawn by
      # layouts/partials/midterms-card-week6.html onto the plate cut by
      # scripts/build-midterms-plate6.py. Its three sections reuse the share
      # cards' copy from weeks one (registration), two (voting options) and
      # three (ID), filled from the same data files. **Bold** opens a line with
      # its label; *italic* sets the rest of the line in italic.
      handbook:
        registration:
          # Tier A, one deadline for every channel.
          same_day:
            lede: "The deadline to register online, in-person, or by mail is {date}"
            mail_postmarked: "If you choose to register by mail, mail your form by {mail_by} to ensure a valid postmark."
            mail_received: "If you choose to register by mail, mail your form by {mail_by} so it arrives in time."
          # Tiers B, C1 and C2: a bullet per way to register. Tier B's in-person
          # deadline is Election Day itself.
          online: "**Online:** Register by {date}"
          in_person: "**In person:** Register by {date}"
          in_person_same_day: "**In person:** Register by {date} (same-day registration)"
          mail_postmarked: "**By-mail:** Postmark by {date} (mail it by {mail_by})"
          mail_received: "**By-mail:** Must arrive by {date} (mail it by {mail_by})"
          # North Dakota. Week one's second line lists ND's IDs, which the ID
          # section below already covers.
          no_registration: "North Dakota does not require voter registration, but you must bring a valid form of ID when you go to the polls."
        voting:
          early: "**In-person early voting:** {start} to {end}"
          early_varies: "**In-person early voting:** Dates are set by your county"
          early_varies_end: "**In-person early voting:** Dates are set by your county, through {end}"
          absentee: "**Absentee & vote-by-mail:** *{type}*"
          request_online: "**Online:** Request by {date}"
          request_mail_received: "**By mail:** Request must be received by {date}"
          request_mail_postmarked: "**By mail:** Request must be postmarked by {date}"
          request_in_person: "**In person:** Request by {date}"
          return: "**Return your mail ballot:** {methods}"
          return_mail_received: "**By mail:** Received by {date}"
          return_mail_postmarked: "**By mail:** Postmarked by {date}"
          return_mail_arrive: ", and must arrive by {date}"
          return_mail_by: " (mail it by {date}!)"
          return_in_person: "**In person:** Received by {date}"
    why:
      # FPO: the copy doc has no heading for this week yet.
      heading: Voting early takes one problem off election day.
      stats:
        - value: 100,000
          text: '[fewer Election Day polling places now](https://www.route-fifty.com/management/2024/03/there-are-100000-fewer-election-day-polling-places-2024/394959/) than there were in 2018.'
        - value: Nearly 500,000
          text: '[mail-in ballots were rejected](https://www.ap.org/news-highlights/elections/2026/nearly-150000-mail-ballots-rejected-in-californias-primary-despite-efforts-to-count-every-vote/) in the 2026 California primary, mostly because they arrived too late.'
        - value: "16"
          text: states allow citizens to [register and vote simultaneously](https://electionlab.mit.edu/research/voter-registration) during the early voting period and Election Day.

  - number: 7
    short: Recheck
    title: Check your work (and vote!)
    state_specific: true
    release: 2026-10-27T09:00:00-07:00
    intro:
      - h3: Already voted by mail?
      - >-
        You’re not done yet! Most states let you track your ballot online or
        sign up for text/email alerts. If ballot tracking is available to you,
        take a few minutes to confirm that yours was received and counted. If
        there is a problem, like a missing signature, your state may let you
        fix it, but only for a limited time. Catching it now gives you time to
        act!
      - h3: Still need to return your mail ballot?
      - >-
        What are you waiting for?! [Due to recent changes, the USPS may not
        postmark your ballot the day it’s received](https://www.npr.org/2026/10/09/nx-s1-5984981/mail-in-ballot-usps-postmark),
        so from here on out (after October 27th) we strongly encourage you to
        deliver your ballot to an approved drop box, local election office, or
        voting site if possible!
      - h3: Planning to vote in-person?
      - >-
        If Early Voting is still happening in your state, get yourself to the
        polls before November 3rd if you can! Life happens, and you wouldn’t
        want an unexpected illness or emergency to keep you from casting a
        ballot. And remember to double-check the hours for your Early Voting
        location before you head out, since they can change.
      - >-
        If you can’t vote early, try to get to the polls early on Tuesday,
        November 3rd. Confirm your polling place, make sure you have the
        required ID (if needed), and block off the time on your calendar.
    headline: MAKE SURE MY VOTE COUNTS
    headline_date: Tue, Nov 3
    # FPO: the copy doc only notes the direction for this message: the last
    # chance to safely mail a ballot, maybe drop box or hand delivery only now.
    message: >-
      SAMPLE MESSAGE — placeholder standing in for this week's wording. It runs
      about three short sentences and roughly this many words, so the card can
      be judged at the size it will really be.
    copy_cta: button1
    rewrite_cta: button2
    # The share modal's prefilled words for the week's own cards ("I tracked
    # my ballot"), as for week six. FPO: placeholder wording.
    share_text:
      threads: "I tracked my ballot! Make sure your vote counts with @5calls and 5 Minute Midterms"
      bsky: "I tracked my ballot! Make sure your vote counts with @5calls.org and 5 Minute Midterms"
      x: "I tracked my ballot! Make sure your vote counts with @make5calls and 5 Minute Midterms"
    # A second set of share cards beside the week's own, "I'm ready to vote!",
    # on week six's "I voted early!" plumbing: each state's link goes to
    # /midterms/share/7/early-ca/. FPO: placeholder wording.
    early_cards:
      week_label: I tracked my ballot
      label: I’m ready to vote!
      text:
        threads: "I'm ready to vote! Make sure your vote counts with @5calls and 5 Minute Midterms"
        bsky: "I'm ready to vote! Make sure your vote counts with @5calls.org and 5 Minute Midterms"
        x: "I'm ready to vote! Make sure your vote counts with @make5calls and 5 Minute Midterms"
    confirm: I checked my work - unlock my achievement graphics!
    # Like week four, no share art or share key, so no share panel and no
    # extra share page.
    extra_credit:
      title: Extra credit
      toggle: I’m ready for more
      locked_note: Confirm you checked your work above to unlock
      part:
        title: Save the Election Protection Hotline Number(s)
        body:
          - >-
            If you have any questions about voting or experience any
            difficulties at the polls, call or text the Election Protection
            Hotline at **866-OUR-VOTE**. (That’s 866-687-8683.) You’ll be able to
            speak to a trained volunteer who can provide assistance if you
            encounter long lines, problems with voting machines, or any other
            obstacles to voting (like voter intimidation or poll worker
            misconduct.)
          - >-
            They also provide language assistance and maintain [voter
            assistance hotlines in multiple languages.](https://protectthevote.net/what-to-share-with-your-community/)
          - - "**888-VE-Y-VOTA** (888-839-8682) – Spanish language hotline"
            - "**888-API-VOTE** (888-274-8683) – Chinese, Vietnamese, Korean, Bengali, Hindi, Urdu and Tagalog hotline"
            - "**844-YALLA-US** (844-925-5287) – Arabic language hotline"
            - "**301-818-VOTE** (301-818-8683) – American Sign Language (video)"
          - Add these numbers to your phone and share them with your friends!
    why:
      # FPO: the copy doc has no heading for this week yet.
      heading: Ballots get rejected for fixable things, if you catch them in time.
      stats:
        - value: Only 27
          text: states allow ballots to be [cured after Election Day](https://ballotpedia.org/Cure_period_for_absentee_and_mail-in_ballots).
        - value: "5"
