  - number: 4
    short: Ballot
    title: Find out what's actually on your ballot
    state_specific: true
    release: 2026-10-06T09:00:00-07:00
    intro: >-
      Most people meet their ballot for the first time in the booth, then guess
      on the down-ballot races. A sample ballot is published weeks ahead — read
      yours now, while there's time to look anything up.
    headline: SAMPLE HEADER LINE FOR THIS WEEK
    headline_date: Tue, Nov 3
    message: >-
      Heads up: your sample ballot is already out. Ours has races and measures
