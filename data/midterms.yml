images:
  locked_note: Tick the box and both sizes unlock, with the site link baked into the art.

# The share row under the images. `caption` is the text carried into a post;
# the link posted alongside it is the reader's own state's share URL, so the
# card shows their rules.
share:
  # Not rendered as words any more — the crops carry a share mark. This is the
  # label a screen reader reads and the tooltip on hover.
  hint: Share this image
  cta: Post this
  # The vertical crop is the one that goes to Instagram, where a link is no
  # use, so it copies the image itself. The horizontal one copies the link.
  copy_image: Copy image
  copy_link: Copy link
  download: Download
  caption: Five minutes a week to protect your vote.

remind:
  title: Get the newsletter
  subtitle: One email a week. Additional info and updates. That’s it.
  placeholder: you@email.com
  cta: Sign me up

# The about page comes back later; until then Privacy is the only link.
footer_links:
