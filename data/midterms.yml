# Content for the temporary /midterms "5 Minute Midterms" page.
# This page is a one-off campaign page; nothing else on the site reads this file.

# Which week is live right now. Weeks before this are "done", weeks after are
# "upcoming". Set this to 0 before the program starts: the page then renders
# the week_zero block below instead of a weekly action, and nothing unlocks.
current_week: 0

# Headline numbers shown in the top bar.
total_actions: 24190

nav:
  nudge: Get the weekly nudge

intro:
  title: Five minutes. No voting fuckery.

# The reader's state. Only one state is configured for now; the header selector
# is FPO until per-state data lands.
#
# name and abbr are rendered (header selector, "CALIFORNIA LINKS" tag, the CA
# pills on upcoming weeks). The deadline fields are not rendered anywhere since
# the state bar was removed — they are kept here to fold into an action's copy.
state:
  name: California
  abbr: CA
  register_by: Mon, Oct 20 — 15 days left
  register_note: Online, by mail, or in person. Same-day registration allowed at polling places.

# Copy for the recap strip that summarizes finished weeks.
recap:
  cta: EXPAND

# Pre-launch state, rendered when current_week is 0. The program has been
# announced but no action has gone out yet, so the only thing to do is sign up
# and there is nothing to unlock. Once week 1 ships, set current_week to 1 and
# none of this is used again.
week_zero:
  kicker: SIGN-UPS OPEN
  title: Eight weeks. Eight small things.
  lede: >-
    Between now and election day we send one action every Monday morning. Each
    one takes about five minutes and each one is picked because it actually
    moves someone closer to voting.
  body:
    - >-
      No phone bank shifts, no weekend commitment, no account to create. You
      get an email, you spend five minutes, you're done until next Monday.
    - >-
      Every action is specific to your state, so the deadlines and links you
      get are the ones that apply to you.
  signup:
    cta: Sign me up
    placeholder: you@email.com
  aside:
    items:
      - label: MONDAY, 9AM
        text: One action lands in your inbox and goes live on this page.
      - label: FIVE MINUTES
        text: Check something, save a date, send one message. That's the whole ask.
      - label: THE REST OF THE WEEK
        text: Nothing. Miss one and the next Monday still works.
  why:
    kicker: WHY EIGHT WEEKS
    heading: Small things, done on a schedule, beat one big push at the end.
    stats:
      - value: 1 in 8
        text: registrations on file are invalid or out of date.
      - value: 8 weeks
        text: is enough time to fix that before the deadlines close.
      - value: 5 min
        text: is all any week asks of you. That is the whole design.

# One entry per week. The entry matching current_week is rendered in full;
# earlier weeks collapse into the recap strip, later weeks into "What's ahead".
weeks:
  - number: 1
    short: Checked
    title: Check your own registration
    recap: Registration checked
    state_specific: true
    release: 2026-09-14T09:00:00-07:00
    minutes: 5
    # Pulls the deadline card from data/midterms_states.yml (VoteAmerica deck)
    # for the reader's state, in place of the copy-and-paste message card.
    state_deck: true
    deck_cta: Check my registration
    deck_note: >-
      Deadlines and rules come from your state's election office. Checking takes
      about a minute, even if you're sure you're registered.
    intro: >-
      Registrations get cancelled more often than people expect — a move, a
      typo, a routine purge. Start here, because every week after this one
      assumes you're on the rolls.
    confirm: I checked — unlock my images
    confirm_count: 3,908 checked
    why:
      kicker: WHY THIS ONE
      heading: The rolls change constantly, and nobody tells you when yours does.
      stats:
        - value: 1 in 8
          text: registrations on file are invalid or out of date.
        - value: Moves
          text: and clerical errors quietly drop people from the rolls.
        - value: 1 min
          text: to confirm you're still registered where you think you are.

  - number: 2
    short: Deadlines
    title: Save every deadline that applies to you
    recap: deadlines saved
    state_specific: true
    release: 2026-09-21T09:00:00-07:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: Every deadline is a different date, and none of them move.
      stats:
        - value: 3 dates
          text: register, request a ballot, return it — all different days.
        - value: No grace
          text: period once a deadline passes in most states.
        - value: 2 min
          text: to put all three in the calendar you actually check.

  - number: 3
    short: ID check
    title: Check your ID rules, recheck your registration
    recap: ID rules checked
    state_specific: true
    release: 2026-09-28T09:00:00-07:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: ID rules changed in a lot of places, and nobody sends a notice.
      stats:
        - value: Varies
          text: by state — some ask for photo ID, some ask for nothing.
        - value: Free
          text: voter ID is available in every state that requires one.
        - value: 2 min
          text: to confirm what you'll be asked for at the table.

  - number: 4
    short: Ballot
    title: Find out what's actually on your ballot
    recap: ballot read
    state_specific: true
    release: 2026-10-05T09:00:00-07:00
    minutes: 5
    intro: >-
      Most people meet their ballot for the first time in the booth, then guess
      on the down-ballot races. A sample ballot is published weeks ahead — read
      yours now, while there's time to look anything up.
    message: >-
      Heads up: your sample ballot is already out. Ours has races and measures
      most people have never heard of — here's the California lookup. Worth five
      minutes now instead of guessing in the booth.
    copy_cta: Copy the message
    rewrite_cta: Rewrite it for me
    confirm: I read my ballot — unlock my images
    confirm_count: 1,204 read
    why:
      heading: The races people skip are the ones closest to their daily life.
      stats:
        - value: 1 in 5
          text: voters leave down-ballot races blank on their ballot.
        - value: Weeks
          text: ahead of the election your sample ballot is already public.
        - value: 5 min
          text: is all any week asks of you. That is the whole design.

  - number: 5
    short: Plan
    title: Make your voting plan
    recap: plan made
    state_specific: true
    release: 2026-10-12T09:00:00-07:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: People who pick a day and a time are the ones who show up.
      stats:
        - value: Day + time
          text: written down somewhere is the entire plan.
        - value: Moved
          text: polling places are common — last cycle's may be gone.
        - value: 3 min
          text: to pick your slot and check where you're going.

  - number: 6
    short: Vote early
    title: Vote early, or get your ballot in the mail
    recap: ballot in
    state_specific: true
    release: 2026-10-19T09:00:00-07:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: Voting early takes one problem off election day.
      stats:
        - value: Days
          text: of early voting in most states, weekends included.
        - value: Postmarks
          text: aren't enough everywhere — some states must receive it.
        - value: 1 trip
          text: and the rest of the week is yours.

  - number: 7
    short: Recheck
    title: Recheck your work
    recap: work rechecked
    state_specific: false
    release: 2026-10-26T09:00:00-07:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: Ballots get rejected for fixable things, if you catch them in time.
      stats:
        - value: Signature
          text: mismatches are the most common reason a ballot is tossed.
        - value: Cure
          text: windows exist in most states, but they close fast.
        - value: 2 min
          text: to track your ballot and confirm it was accepted.

  - number: 8
    short: Vote
    title: Vote
    recap: voted
    state_specific: false
    release: 2026-11-02T09:00:00-08:00
    # FPO: placeholder copy, replace before this week ships.
    why:
      heading: Eight weeks of small things end with the one that counts.
      stats:
        - value: Poll hours
          text: vary by state — check yours before you head out.
        - value: In line
          text: when polls close still means you get to vote.
        - value: Done
          text: that's the whole program. Thanks for doing it.

ahead:
  title: What's ahead

images:
  locked_note: Tick the box and both sizes unlock, with the site link baked into the art.
  library_label: "YOURS: WEEKS 1–3"
  library_note: Re-post any time
  library_cta: Open library

remind:
  title: Week 5 lands Monday.
  subtitle: One email a week, nothing else. No account needed.
  placeholder: you@email.com
  cta: Remind me

footer_links:
  - title: Who's behind this
    url: /about-us/
  - title: Archive
    url: "#ahead"
  - title: Privacy
    url: /privacy/
