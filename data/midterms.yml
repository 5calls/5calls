# The smaller second line under every week's confirm checkbox. The big line is
# the week's own `confirm`; this one says what ticking the box does and reads
# the same on every week, so it lives here rather than per week.
confirm_note: unlock my share graphics

# Added to the live API figure behind "total actions completed". Most people
# who act in the VoteAmerica form never come back here to tick a box, so the
# API on its own undercounts the program badly.
#
# This is a DIFFERENCE, not the VoteAmerica total. On 2026-09-21 the form had
# 4,650 confirmed actions and api.5calls.org/v1/midterms/counts returned 2,131,
# so the base is 4650 - 2131 = 2519 and the page reads 4,650 today.
#
# To refresh it: take the current VoteAmerica total, subtract whatever
# /v1/midterms/counts returns at that moment, and store the difference. Pasting
# the raw form total here would count the site's own tickers twice over.
counts:
  base: 2519

images:
  # The heading over the week's share images.
  title: Show you did it
  # The panel sits beside the action on wide screens and below it once they
  # stack, so the note says which.
  locked_note: Confirm your registration on the left to unlock the share images.
  locked_note_stacked: Confirm your registration above to unlock the share images.

# The share row under the images. `caption` is the text carried into a post;
# the link posted alongside it is the reader's own state's share URL, so the
# card shows their rules.
share:
  # Not rendered as words any more — the crops carry a share mark. This is the
  # label a screen reader reads and the tooltip on hover.
  hint: Share this image
  caption: Five minutes a week to protect your vote.
  # The button in the share modal's row that flips the preview between the
  # vertical and horizontal crops. Reads the same on both.
  switch: Switch size
  # Shown under the share row when the Instagram button can't hand the image
  # straight to the share sheet: one tip for phones, one for desktop.
  instagram:
    touch_tip: Press and hold the image to save it, then post it from Instagram.
    desktop_tip: Download the image, then upload it on Instagram.
    download: Download image

remind:
  title: Get the newsletter
  subtitle: One email a week. Additional info and updates. That’s it.
  placeholder: you@email.com
  cta: Sign me up

# The about page comes back later; until then Privacy is the only link.
footer_links:
  - title: Privacy
    url: /privacy/
